; PlatformIO — конфігурація проєкту
; Плата: Waveshare ESP32-S3-Zero (ESP32-S3FH4R2: 4 MB flash, 2 MB PSRAM, рідний USB)

[env:esp32-s3-zero]
; pioarduino — спільнотна платформа з Arduino-ESP32 3.x
; (стандартна "espressif32" досі дає старий 2.x, де немає rgbLedWrite)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

; Найближча стандартна плата на S3; нижче підганяємо під S3-Zero
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi

build_flags =
    -DARDUINO_USB_MODE=1        ; USB працює як вбудований USB-Serial/JTAG
    -DARDUINO_USB_CDC_ON_BOOT=1 ; Serial.print іде в USB, окремий адаптер не потрібен
    -DBOARD_HAS_PSRAM

extra_scripts = pre:scripts/embed_assets.py   ; gzips src/web/style.css + app.js into assets_gz.h

monitor_speed = 115200
upload_speed = 921600
